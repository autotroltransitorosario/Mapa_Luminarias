<style>
:root {
  --bg: #0f1923;
  --card: #16222f;
  --border: #1e3048;
  --orange: #E87D2B;
  --orange-dim: rgba(232,125,43,0.15);
  --text: #e0e8f0;
  --muted: #7a95b0;
  --lampara: #FFD166;
  --columna: #4FC3F7;
  --transversal: #81C784;
  --other: #90A4AE;
  --radius: 8px;
  --header-h: 56px;
  --search-h: 60px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}

/* HEADER */
#header{
  position:fixed;top:0;left:0;right:0;height:var(--header-h);
  background:var(--card);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 12px;gap:10px;z-index:1000;
}
#header-logo{width:32px;height:32px;flex-shrink:0}
#header-title{font-size:15px;font-weight:700;color:var(--text);flex:1;min-width:0}
#header-title span{color:var(--orange)}
#count-badge{
  background:var(--orange-dim);border:1px solid var(--orange);color:var(--orange);
  font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;
}

/* SEARCH BAR */
#searchbar{
  position:fixed;top:var(--header-h);left:0;right:0;
  background:var(--card);border-bottom:1px solid var(--border);
  padding:8px 10px;display:flex;align-items:center;gap:6px;z-index:999;
  flex-wrap:wrap;
}
#addr-input{
  flex:1;min-width:120px;height:38px;padding:0 12px;
  background:#0f1923;border:1px solid var(--border);border-radius:var(--radius);
  color:var(--text);font-size:14px;outline:none;
  transition:border-color .2s;
}
#addr-input:focus{border-color:var(--orange)}
#addr-input::placeholder{color:var(--muted)}
#radius-wrap{display:flex;align-items:center;gap:5px;white-space:nowrap}
#radius-wrap label{font-size:12px;color:var(--muted)}
#radius-input{
  width:70px;height:38px;padding:0 8px;
  background:#0f1923;border:1px solid var(--border);border-radius:var(--radius);
  color:var(--text);font-size:14px;outline:none;text-align:center;
  transition:border-color .2s;
}
#radius-input:focus{border-color:var(--orange)}
#radius-wrap span{font-size:12px;color:var(--muted)}
#search-btn{
  height:38px;padding:0 16px;
  background:var(--orange);border:none;border-radius:var(--radius);
  color:#fff;font-size:14px;font-weight:700;cursor:pointer;
  white-space:nowrap;transition:opacity .2s;
}
#search-btn:hover{opacity:.85}
#search-btn:disabled{opacity:.5;cursor:default}
#search-btn.loading{
  background:var(--card);border:1px solid var(--border);color:var(--muted);
}

/* MAP */
#map{
  position:fixed;
  top:calc(var(--header-h) + var(--search-h));
  left:0;right:0;bottom:0;
  background:var(--bg);
}

/* TOAST */
#toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:rgba(22,34,47,.95);border:1px solid var(--border);
  color:var(--text);font-size:13px;padding:8px 16px;border-radius:20px;
  z-index:2000;white-space:nowrap;pointer-events:none;
  opacity:0;transition:opacity .3s;
}
#toast.show{opacity:1}

/* LEGEND */
#legend{
  position:fixed;bottom:16px;left:10px;
  background:rgba(22,34,47,.92);border:1px solid var(--border);
  border-radius:var(--radius);padding:8px 10px;z-index:1000;
  font-size:11px;line-height:1.8;
}
.leg-row{display:flex;align-items:center;gap:6px}
.leg-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;border:1.5px solid rgba(255,255,255,.25)}

/* LOADING OVERLAY */
#loading{
  position:fixed;inset:0;
  background:rgba(15,25,35,.85);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;z-index:3000;
}
#loading.hidden{display:none}
.spinner{
  width:40px;height:40px;border:3px solid var(--border);
  border-top-color:var(--orange);border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-msg{font-size:14px;color:var(--muted)}

/* INSTALL BUTTON */
#installBtn{
  display:none;height:38px;padding:0 12px;
  background:transparent;border:1px solid var(--orange);
  color:var(--orange);font-size:12px;font-weight:700;
  border-radius:var(--radius);cursor:pointer;white-space:nowrap;
  transition:background .2s;
}
#installBtn.visible{display:block}
#installBtn:hover{background:var(--orange-dim)}

/* UPLOAD BUTTON */
#uploadBtn{
  height:38px;padding:0 12px;
  background:transparent;border:1px solid var(--border);
  color:var(--muted);font-size:12px;font-weight:700;
  border-radius:var(--radius);cursor:pointer;white-space:nowrap;
  transition:border-color .2s,color .2s;
  display:flex;align-items:center;gap:5px;
}
#uploadBtn:hover{border-color:var(--orange);color:var(--orange)}
#uploadBtn.active{border-color:var(--orange);color:var(--orange);background:var(--orange-dim)}

/* ERROR BANNER */
#errorBanner{
  display:none;position:fixed;
  top:calc(var(--header-h) + var(--search-h) + 8px);
  left:10px;right:10px;
  background:var(--card);border:1px solid #c0392b;
  border-radius:var(--radius);padding:10px 14px;
  z-index:1500;font-size:13px;color:var(--text);
  line-height:1.5;
}
#errorBanner b{color:#e74c3c}
#errorBanner .close-banner{float:right;cursor:pointer;color:var(--muted);font-size:16px;line-height:1}

/* IOS BANNER */
#iosBanner{
  display:none;position:fixed;bottom:70px;left:10px;right:10px;
  background:var(--card);border:1px solid var(--orange);border-radius:var(--radius);
  padding:10px 14px;z-index:2000;font-size:13px;color:var(--text);
}
#iosBanner .ios-close{float:right;cursor:pointer;color:var(--muted);font-size:16px}

/* POPUP */
.autotrol-popup .leaflet-popup-content-wrapper{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:0 4px 20px rgba(0,0,0,.5);
  color:var(--text);padding:0;
}
.autotrol-popup .leaflet-popup-content{margin:0;min-width:180px}
.autotrol-popup .leaflet-popup-tip{background:var(--card)}
.popup-body{padding:10px 12px}
.popup-serie{font-size:13px;font-weight:700;color:var(--orange);margin-bottom:4px}
.popup-tipo{
  display:inline-block;font-size:11px;font-weight:700;
  padding:2px 8px;border-radius:10px;margin-bottom:6px;
}
.popup-tipo.lampara{background:rgba(255,209,102,.2);color:var(--lampara);border:1px solid var(--lampara)}
.popup-tipo.columna{background:rgba(79,195,247,.2);color:var(--columna);border:1px solid var(--columna)}
.popup-tipo.transversal{background:rgba(129,199,132,.2);color:var(--transversal);border:1px solid var(--transversal)}
.popup-tipo.other{background:rgba(144,164,174,.2);color:var(--other);border:1px solid var(--other)}
.popup-row{font-size:12px;color:var(--muted);margin-bottom:2px}
.popup-row b{color:var(--text)}

/* Leaflet dark overrides */
.leaflet-bar a{background:var(--card)!important;color:var(--text)!important;border-color:var(--border)!important}
.leaflet-bar a:hover{background:var(--border)!important}
.leaflet-control-attribution{background:rgba(15,25,35,.7)!important;color:var(--muted)!important;font-size:10px!important}
.leaflet-control-attribution a{color:var(--muted)!important}
.marker-cluster-small,.marker-cluster-medium,.marker-cluster-large{background:rgba(232,125,43,.2)!important}
.marker-cluster-small div,.marker-cluster-medium div,.marker-cluster-large div{background:rgba(232,125,43,.6)!important;color:#fff!important;font-weight:700}

/* MOBILE adjustments */
@media(max-width:500px){
  #searchbar{flex-wrap:wrap}
  #addr-input{min-width:100%;order:1}
  #radius-wrap{order:2}
  #search-btn{order:3}
  #installBtn{order:4}
  #map{top:calc(var(--header-h) + 108px)}
}
</style>
</head>

// ── CONFIG ─────────────────────────────────────────────────────────────────
const SHEET_ID  = '1axiovMoPXFwQ-FFHBJ-xR4XR7hE_IYVMkt0EcJhiDYs';
const GID       = '130891161';
// Dos URLs alternativas (la primera es la estándar, la segunda usa gviz con mejor CORS)
const CSV_URLS  = [
  `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`,
  `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}`
];
const CITY_HINT = 'Rosario, Santa Fe, Argentina';
const NOMINATIM = 'https://nominatim.openstreetmap.org/search';
const CACHE_KEY = 'autotrol_alumbrado_data_v2';
const CACHE_TS  = 'autotrol_alumbrado_ts_v2';
const CACHE_TTL = 6 * 60 * 60 * 1000; // 6 horas

// Columnas (0-indexed): A=0,B=1,C=2,H=7,I=8,M=12(X GK),N=13(Y GK)
const COL = { serie:0, tipo:1, clasif:2, calle:7, altura:8, gkX:12, gkY:13 };

// ── CONVERSIÓN GAUSS-KRÜGER ARG ZONA 3 → WGS84 ────────────────────────────
// Faja 3: CM=-60°, FE=5.500.000, FN=10.000.000, k0=1, elipsoide GRS80
function gkToLatLon(X, Y) {
  const a  = 6378137.0;
  const f  = 1 / 298.257222101; // GRS80
  const e2 = 2*f - f*f;
  const e4 = e2*e2;
  const e6 = e2*e2*e2;

  const lon0 = -60 * Math.PI / 180;
  const FE   = 5500000;
  const FN   = 10001966; // arco meridiano ec→polo sur (POSGAR/GK faja 5)

  const x = X - FE;
  const y = Y - FN;

  // Latitud del punto de pie
  const mu = y / (a * (1 - e2/4 - 3*e4/64 - 5*e6/256));

  const sqe = Math.sqrt(1 - e2);
  const n   = (1 - sqe) / (1 + sqe);
  const n2  = n*n, n3 = n2*n, n4 = n2*n2;

  const phi1 = mu
    + (3*n/2 - 27*n3/32)   * Math.sin(2*mu)
    + (21*n2/16 - 55*n4/32)* Math.sin(4*mu)
    + (151*n3/96)           * Math.sin(6*mu)
    + (1097*n4/512)         * Math.sin(8*mu);

  const sp = Math.sin(phi1), cp = Math.cos(phi1), tp = sp/cp;
  const N1 = a / Math.sqrt(1 - e2*sp*sp);
  const T1 = tp*tp;
  const C1 = e2/(1-e2) * cp*cp;
  const R1 = a*(1-e2) / Math.pow(1 - e2*sp*sp, 1.5);
  const D  = x / N1;
  const D2 = D*D, D3 = D2*D, D4 = D2*D2, D5 = D3*D2, D6 = D3*D3;

  const lat = phi1 - (N1*tp/R1) * (
    D2/2
    - (5 + 3*T1 + 10*C1 - 4*C1*C1 - 9*e2/(1-e2)) * D4/24
    + (61 + 90*T1 + 298*C1 + 45*T1*T1 - 252*e2/(1-e2) - 3*C1*C1) * D6/720
  );

  const lon = lon0 + (
    D
    - (1 + 2*T1 + C1) * D3/6
    + (5 - 2*C1 + 28*T1 - 3*C1*C1 + 8*e2/(1-e2) + 24*T1*T1) * D5/120
  ) / cp;

  return { lat: lat * 180/Math.PI, lon: lon * 180/Math.PI };
}

// ── ESTADO ─────────────────────────────────────────────────────────────────

// ── MAP INIT ───────────────────────────────────────────────────────────────

    center:[-32.883,-60.723],

// ── CSV PARSER ─────────────────────────────────────────────────────────────
function parseRow(row, sep){
  const cols=[];
  let inQ=false, cur='';
  for(let i=0;i<row.length;i++){
    const c=row[i];
    if(c==='"'){ inQ=!inQ; }
    else if(c===sep&&!inQ){ cols.push(cur); cur=''; }
    else cur+=c;
  }
  cols.push(cur);
  return cols;
}

// Detecta si el CSV usa coma o punto y coma como separador
function detectSep(firstLine){
  const commas = (firstLine.match(/,/g)||[]).length;
  const semis  = (firstLine.match(/;/g)||[]).length;
  return semis > commas ? ';' : ',';
}

// Normaliza número: reemplaza coma decimal por punto si hace falta
function parseCoord(s){
  if(!s) return NaN;
  // Si tiene coma pero no punto, es separador decimal europeo
  const cleaned = s.trim().replace(',','.');
  return parseFloat(cleaned);
}

function parseCSV(text){
  const lines = text.split(/\r?\n/);
  if(lines.length < 2) return [];

  // Detectar separador usando la primera línea (header)
  const sep = detectSep(lines[0]);

  // Auto-detectar columnas por nombre de cabecera
  const headers = parseRow(lines[0], sep).map(h=>h.replace(/"/g,'').trim().toLowerCase());
  let colX = headers.findIndex(h=>h.includes('coordenada x'));
  let colY = headers.findIndex(h=>h.includes('coordenada y'));
  // Fallback a índices fijos si no se encuentran los headers
  if(colX < 0) colX = COL.gkX;
  if(colY < 0) colY = COL.gkY;

  const colSerie  = headers.findIndex(h=>h.includes('serie'))   >= 0 ? headers.findIndex(h=>h.includes('serie'))   : COL.serie;
  const colTipo   = headers.findIndex(h=>h==='tipo')             >= 0 ? headers.findIndex(h=>h==='tipo')             : COL.tipo;
  const colClasif = headers.findIndex(h=>h.includes('clasif'))  >= 0 ? headers.findIndex(h=>h.includes('clasif'))  : COL.clasif;
  const colCalle  = headers.findIndex(h=>h.includes('calle'))   >= 0 ? headers.findIndex(h=>h.includes('calle'))   : COL.calle;
  const colAltura = headers.findIndex(h=>h.includes('altura'))  >= 0 ? headers.findIndex(h=>h.includes('altura'))  : COL.altura;

  const result = [];
  for(let i=1;i<lines.length;i++){
    const line=lines[i].trim();
    if(!line) continue;
    const cols=parseRow(line, sep);
    const gkX=parseCoord(cols[colX]);
    const gkY=parseCoord(cols[colY]);
    if(isNaN(gkX)||isNaN(gkY)) continue;
    if(gkX < 4000000 || gkX > 7000000) continue; // rango esperado Gauss-Krüger X
    if(gkY < 4000000 || gkY > 8000000) continue; // rango esperado Gauss-Krüger Y
    const {lat,lon} = gkToLatLon(gkX, gkY);
    if(isNaN(lat)||isNaN(lon)) continue;
    if(lat < -55 || lat > -20 || lon < -75 || lon > -50) continue; // Argentina
    result.push({
      serie: (cols[colSerie]||'').replace(/"/g,''),
      tipo:  (cols[colTipo]||'').replace(/"/g,''),
      clasif:(cols[colClasif]||'').replace(/"/g,''),
      calle: (cols[colCalle]||'').replace(/"/g,'').trim().toUpperCase(),
      altura:(cols[colAltura]||'').replace(/"/g,'').trim(),
      lat, lon
    });
  }
  return result;
}

// ── DATA LOADING ───────────────────────────────────────────────────────────
async function cargarDatos(){
  setLoading(true,'Cargando equipamiento…');

  // 1. Intentar caché localStorage
  try{
    const ts = localStorage.getItem(CACHE_TS);
    const cached = localStorage.getItem(CACHE_KEY);
    if(ts && cached && (Date.now()-parseInt(ts)) < CACHE_TTL){
      datos = JSON.parse(cached);
      if(datos.length > 0){
        setLoading(false);
        actualizarBadge();
        toast(`${datos.length.toLocaleString()} equipos cargados (caché)`);
        return;
      }
    }
  }catch(e){}

  // 2. Intentar fetch desde Google Sheets (dos URLs)
  for(let i=0; i<CSV_URLS.length; i++){
    try{
      setLoading(true, i===0 ? 'Descargando datos…' : 'Reintentando con URL alternativa…');
      const resp = await fetch(CSV_URLS[i]);
      if(!resp.ok) throw new Error('HTTP '+resp.status);
      const text = await resp.text();
      // Verificar que sea CSV real (no HTML de error de Google)
      if(text.trim().startsWith('<!')) throw new Error('Respuesta HTML (requiere acceso)');
      setLoading(true,'Procesando datos…');
      const parsed = parseCSV(text);
      if(parsed.length === 0) throw new Error('Sin datos válidos');

      datos = parsed;
      try{
        localStorage.setItem(CACHE_KEY, JSON.stringify(datos));
        localStorage.setItem(CACHE_TS, Date.now().toString());
      }catch(e){}

      setLoading(false);
      actualizarBadge();
      toast(`${datos.length.toLocaleString()} equipos disponibles`);
      return;
    }catch(err){
      // continuar con siguiente URL
    }
  }

  // 3. Sin conexión: intentar caché expirada
  try{
    const cached = localStorage.getItem(CACHE_KEY);
    if(cached){
      const parsed = JSON.parse(cached);
      if(parsed.length > 0){
        datos = parsed;
        setLoading(false);
        actualizarBadge();
        toast('Usando datos en caché (sin conexión)');
        return;
      }
    }
  }catch(e){}

  // 4. Todo falló → mostrar banner de carga manual
  setLoading(false);
  document.getElementById('errorBanner').style.display='block';
  document.getElementById('uploadBtn').classList.add('active');
  toast('No se pudo descargar. Usá el botón "Cargar archivo".', 6000);
}

// ── CARGA DESDE ARCHIVO LOCAL ──────────────────────────────────────────────
function cargarDesdeArchivo(input){
  const file = input.files[0];
  if(!file) return;
  setLoading(true,'Leyendo archivo…');
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      setLoading(true,'Procesando datos…');
      const parsed = parseCSV(e.target.result);
      if(parsed.length === 0){
        setLoading(false);
        toast('No se encontraron coordenadas válidas en el archivo.');
        return;
      }
      datos = parsed;
      try{
        localStorage.setItem(CACHE_KEY, JSON.stringify(datos));
        localStorage.setItem(CACHE_TS, Date.now().toString());
      }catch(er){}
      setLoading(false);
      actualizarBadge();
      document.getElementById('errorBanner').style.display='none';
      document.getElementById('uploadBtn').classList.add('active');
      toast(`✓ ${datos.length.toLocaleString()} equipos cargados desde archivo`);
    }catch(err){
      setLoading(false);
      toast('Error al leer el archivo: '+err.message);
    }
  };
  reader.onerror = function(){
    setLoading(false);
    toast('Error al leer el archivo.');
  };
  reader.readAsText(file, 'UTF-8');
  // Limpiar input para permitir re-carga del mismo archivo
  input.value='';
}

function actualizarBadge(){
  const el = document.getElementById('count-badge');
  if(datos.length > 0) el.textContent = `${datos.length.toLocaleString()} equipos`;
}

// ── GEOCODIFICACIÓN ────────────────────────────────────────────────────────
async function geocodificar(addr){
  const q = encodeURIComponent(`${addr}, ${CITY_HINT}`);
  const url = `${NOMINATIM}?q=${q}&format=json&limit=1&accept-language=es`;
  const resp = await fetch(url, {headers:{'Accept-Language':'es'}});
  const arr = await resp.json();
  if(!arr.length) throw new Error('No se encontró la dirección');
  return { lat:parseFloat(arr[0].lat), lon:parseFloat(arr[0].lon), display:arr[0].display_name };
}

// ── DISTANCIA (Haversine) ───────────────────────────────────────────────────
function haversine(lat1,lon1,lat2,lon2){
  const R=6371000;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2 +
          Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ── MARCADORES ────────────────────────────────────────────────────────────
function tipoClass(tipo){
  const t=tipo.toLowerCase();
  if(t.includes('lámpara')||t.includes('lampara')) return 'lampara';
  if(t.includes('columna')) return 'columna';
  if(t.includes('transversal')) return 'transversal';
  return 'other';
}

function tipoColor(tipo){
  const c=tipoClass(tipo);
  return c==='lampara'?'#FFD166':c==='columna'?'#4FC3F7':c==='transversal'?'#81C784':'#90A4AE';
}

function makeIcon(tipo){
  const color=tipoColor(tipo);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14">
    <circle cx="7" cy="7" r="6" fill="${color}" stroke="#fff" stroke-width="1.5"/>
  </svg>`;
  return L.divIcon({html:svg,iconSize:[14,14],iconAnchor:[7,7],className:'',popupAnchor:[0,-7]});
}

function makePopup(d){
  const tc=tipoClass(d.tipo);
  return `<div class="popup-body">
    <div class="popup-serie">Nº ${d.serie}</div>
    <span class="popup-tipo ${tc}">${d.tipo}</span>
    ${d.clasif?`<div class="popup-row"><b>Clasificación:</b> ${d.clasif}</div>`:''}
    <div class="popup-row"><b>Ubicación:</b> ${d.calle} ${d.altura}</div>
    <div class="popup-row"><b>Coord:</b> ${d.lat.toFixed(6)}, ${d.lon.toFixed(6)}</div>
  </div>`;
}

// ── BÚSQUEDA PRINCIPAL ─────────────────────────────────────────────────────
async function buscar(){
  const addr = document.getElementById('addr-input').value.trim();
  const radio = parseInt(document.getElementById('radius-input').value)||1000;

  if(!addr){ toast('Ingresá una dirección para buscar'); return; }
  if(!datos.length){
    toast('Cargá los datos primero usando el botón "Cargar archivo"');
    document.getElementById('uploadBtn').classList.add('active');
    return;
  }

  const btn=document.getElementById('search-btn');
  btn.textContent='Buscando…'; btn.disabled=true; btn.classList.add('loading');

  try{
    const geo = await geocodificar(addr);

    // Filtrar por radio
    const dentro = datos.filter(d => haversine(geo.lat,geo.lon,d.lat,d.lon) <= radio);

    // Limpiar capa
    clusterLayer.clearLayers();
    if(radiusCircle){ map.removeLayer(radiusCircle); radiusCircle=null; }

    // Círculo de radio
    radiusCircle = L.circle([geo.lat,geo.lon],{
      radius: radio,
      color: '#E87D2B', weight:1.5,
      fillColor:'#E87D2B', fillOpacity:0.06
    }).addTo(map);

    // Marcadores
    const markers = dentro.map(d => {
      const m = L.marker([d.lat,d.lon],{icon:makeIcon(d.tipo)});
      m.bindPopup(makePopup(d),{className:'autotrol-popup',maxWidth:240});
      return m;
    });
    clusterLayer.addLayers(markers);

    // Mover mapa
    map.setView([geo.lat,geo.lon], radio<=300?17:radio<=600?16:radio<=1500?15:14);

    // Badge
    document.getElementById('count-badge').textContent=
      `${dentro.length.toLocaleString()} equipo${dentro.length!==1?'s':''}`;

    toast(`${dentro.length} equipos en ${radio} m de "${addr.split(',')[0]}"`);
  }catch(err){
    toast(err.message||'Error al buscar dirección');
  }finally{
    btn.textContent='Buscar'; btn.disabled=false; btn.classList.remove('loading');
  }
}

// Enter en el input
document.getElementById('addr-input').addEventListener('keydown',e=>{
  if(e.key==='Enter') buscar();
});

// ── HELPERS ───────────────────────────────────────────────────────────────
function setLoading(show,msg){
  const el=document.getElementById('loading');
  el.classList.toggle('hidden',!show);
  if(msg) document.getElementById('loading-msg').textContent=msg;
}

let toastTimer=null;
function toast(msg,ms=3000){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),ms);
}

window.addEventListener('resize',adjustMap);
