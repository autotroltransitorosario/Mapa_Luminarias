<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

<style>
:root {
  --bg: #0f1923;
  --card: #16222f;
  --border: #1e3048;
  --orange: #E87D2B;
  --orange-dim: rgba(232,125,43,0.15);
  --text: #e0e8f0;
  --muted: #7a95b0;
  /* Colores por tipo */
  --c-lampara:    #FFD166;
  --c-columna:    #9E9E9E;
  --c-tablero:    #E87D2B;
  --c-transversal:#81C784;
  --c-other:      #607D8B;
  --radius: 8px;
  --header-h: 56px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}

/* HEADER */
#header{
  position:fixed;top:0;left:0;right:0;height:var(--header-h);
  background:var(--card);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 12px;gap:10px;z-index:1000;
}
#header-logo{width:32px;height:32px;flex-shrink:0}
#header-title{font-size:15px;font-weight:700;color:var(--text);flex:1;min-width:0}
#header-title span{color:var(--orange)}
#count-badge{
  background:var(--orange-dim);border:1px solid var(--orange);color:var(--orange);
  font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;
}

/* SEARCH BAR */
#searchbar{
  position:fixed;top:var(--header-h);left:0;right:0;
  background:var(--card);border-bottom:1px solid var(--border);
  padding:8px 10px;display:flex;align-items:center;gap:6px;z-index:999;
  flex-wrap:wrap;
}
#addr-input{
  flex:1;min-width:120px;height:38px;padding:0 12px;
  background:#0f1923;border:1px solid var(--border);border-radius:var(--radius);
  color:var(--text);font-size:14px;outline:none;transition:border-color .2s;
}
#addr-input:focus{border-color:var(--orange)}
#addr-input::placeholder{color:var(--muted)}
#radius-wrap{display:flex;align-items:center;gap:5px;white-space:nowrap}
#radius-wrap label{font-size:12px;color:var(--muted)}
#radius-input{
  width:70px;height:38px;padding:0 8px;
  background:#0f1923;border:1px solid var(--border);border-radius:var(--radius);
  color:var(--text);font-size:14px;outline:none;text-align:center;transition:border-color .2s;
}
#radius-input:focus{border-color:var(--orange)}
#radius-wrap span{font-size:12px;color:var(--muted)}
#search-btn{
  height:38px;padding:0 16px;
  background:var(--orange);border:none;border-radius:var(--radius);
  color:#fff;font-size:14px;font-weight:700;cursor:pointer;
  white-space:nowrap;transition:opacity .2s;
}
#search-btn:hover{opacity:.85}
#search-btn:disabled{opacity:.5;cursor:default}
#search-btn.loading{background:var(--card);border:1px solid var(--border);color:var(--muted)}
#uploadBtn{
  height:38px;padding:0 12px;
  background:transparent;border:1px solid var(--border);
  color:var(--muted);font-size:12px;font-weight:700;
  border-radius:var(--radius);cursor:pointer;white-space:nowrap;
  transition:border-color .2s,color .2s;display:flex;align-items:center;gap:5px;
}
#uploadBtn:hover{border-color:var(--orange);color:var(--orange)}
#uploadBtn.active{border-color:var(--orange);color:var(--orange);background:var(--orange-dim)}
#installBtn{
  display:none;height:38px;padding:0 12px;
  background:transparent;border:1px solid var(--orange);
  color:var(--orange);font-size:12px;font-weight:700;
  border-radius:var(--radius);cursor:pointer;white-space:nowrap;transition:background .2s;
}
#installBtn.visible{display:block}
#installBtn:hover{background:var(--orange-dim)}

/* MAP */
#map{
  position:fixed;
  top:calc(var(--header-h) + 56px);
  left:0;right:0;bottom:0;
  background:var(--bg);
}

/* TOAST */
#toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:rgba(22,34,47,.95);border:1px solid var(--border);
  color:var(--text);font-size:13px;padding:8px 16px;border-radius:20px;
  z-index:2000;white-space:nowrap;pointer-events:none;
  opacity:0;transition:opacity .3s;
}
#toast.show{opacity:1}

/* LAYER PANEL */
#layerPanel{
  position:fixed;bottom:16px;right:10px;
  background:rgba(22,34,47,.95);border:1px solid var(--border);
  border-radius:var(--radius);padding:10px 12px;z-index:1000;
  font-size:12px;min-width:140px;
  box-shadow:0 2px 12px rgba(0,0,0,.4);
}
#layerPanel h4{
  font-size:10px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;
}
.layer-row{
  display:flex;align-items:center;gap:7px;
  padding:3px 0;cursor:pointer;user-select:none;
}
.layer-row input[type=checkbox]{
  appearance:none;-webkit-appearance:none;
  width:14px;height:14px;border-radius:3px;
  border:1.5px solid var(--border);background:transparent;
  cursor:pointer;flex-shrink:0;position:relative;transition:background .15s,border-color .15s;
}
.layer-row input[type=checkbox]:checked{
  border-color:currentColor;background:currentColor;
}
.layer-row input[type=checkbox]:checked::after{
  content:'';position:absolute;top:1px;left:3px;
  width:5px;height:8px;border:2px solid #0f1923;
  border-top:none;border-left:none;transform:rotate(45deg);
}
.layer-dot{
  width:10px;height:10px;border-radius:50%;flex-shrink:0;
  border:1.5px solid rgba(255,255,255,.2);
}
.layer-label{color:var(--text);font-size:12px}
.layer-count{margin-left:auto;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}

/* LOADING OVERLAY */
#loading{
  position:fixed;inset:0;
  background:rgba(15,25,35,.85);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;z-index:3000;
}
#loading.hidden{display:none}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-msg{font-size:14px;color:var(--muted)}

/* WELCOME CARD */
#welcomeCard{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:28px 24px;z-index:2000;
  width:min(340px,calc(100vw - 32px));
  text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.6);
}
#welcomeCard.hidden{display:none}
.wc-icon{font-size:36px;margin-bottom:12px}
.wc-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px}
.wc-sub{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.5}
.wc-upload-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;height:46px;background:var(--orange);border:none;border-radius:var(--radius);
  color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .2s;margin-bottom:12px;
}
.wc-upload-btn:hover{opacity:.88}
.wc-net-btn{
  background:none;border:1px solid var(--border);border-radius:var(--radius);
  color:var(--muted);font-size:12px;padding:7px 14px;cursor:pointer;transition:border-color .2s,color .2s;
}
.wc-net-btn:hover{border-color:var(--orange);color:var(--orange)}
.wc-net-btn:disabled{opacity:.4;cursor:default}
.wc-steps{font-size:11px;color:var(--muted);margin-top:14px;text-align:left;line-height:1.7}
.wc-steps b{color:var(--text)}
.wc-spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:4px}

/* POPUP */
.autotrol-popup .leaflet-popup-content-wrapper{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:0 4px 20px rgba(0,0,0,.5);color:var(--text);padding:0;
}
.autotrol-popup .leaflet-popup-content{margin:0;min-width:180px}
.autotrol-popup .leaflet-popup-tip{background:var(--card)}
.popup-body{padding:10px 12px}
.popup-serie{font-size:13px;font-weight:700;color:var(--orange);margin-bottom:4px}
.popup-tipo{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin-bottom:6px}
.popup-tipo.lampara    {background:rgba(255,209,102,.18);color:var(--c-lampara);border:1px solid var(--c-lampara)}
.popup-tipo.columna    {background:rgba(158,158,158,.18);color:var(--c-columna);border:1px solid var(--c-columna)}
.popup-tipo.tablero    {background:rgba(232,125,43,.18); color:var(--c-tablero);border:1px solid var(--c-tablero)}
.popup-tipo.transversal{background:rgba(129,199,132,.18);color:var(--c-transversal);border:1px solid var(--c-transversal)}
.popup-tipo.other      {background:rgba(96,125,139,.18); color:var(--c-other);border:1px solid var(--c-other)}
.popup-row{font-size:12px;color:var(--muted);margin-bottom:2px}
.popup-row b{color:var(--text)}

/* Leaflet dark overrides */
.leaflet-bar a{background:var(--card)!important;color:var(--text)!important;border-color:var(--border)!important}
.leaflet-bar a:hover{background:var(--border)!important}
.leaflet-control-attribution{background:rgba(15,25,35,.7)!important;color:var(--muted)!important;font-size:10px!important}
.leaflet-control-attribution a{color:var(--muted)!important}

/* iOS BANNER */
#iosBanner{
  display:none;position:fixed;bottom:140px;left:10px;right:10px;
  background:var(--card);border:1px solid var(--orange);border-radius:var(--radius);
  padding:10px 14px;z-index:2000;font-size:13px;color:var(--text);
}
#iosBanner .ios-close{float:right;cursor:pointer;color:var(--muted);font-size:16px}

/* MOBILE */
@media(max-width:500px){
  #searchbar{flex-wrap:wrap}
  #addr-input{min-width:100%;order:1}
  #radius-wrap{order:2}
  #search-btn{order:3}
  #uploadBtn{order:4}
  #installBtn{order:5}
  #map{top:calc(var(--header-h) + 108px)}
}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading" class="hidden">
  <div class="spinner"></div>
  <div id="loading-msg">Buscando…</div>
</div>

<!-- WELCOME CARD -->
<div id="welcomeCard">
  <div class="wc-icon">🗺️</div>
  <div class="wc-title">Equipamiento de Alumbrado</div>
  <div class="wc-sub">Cargá el archivo CSV exportado de la planilla para ver los equipos en el mapa.</div>
  <button class="wc-upload-btn" onclick="document.getElementById('file-input').click()">
    <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a1 1 0 0 1 1 1v5.586l1.293-1.293a1 1 0 1 1 1.414 1.414l-3 3a1 1 0 0 1-1.414 0l-3-3a1 1 0 1 1 1.414-1.414L7 7.586V2a1 1 0 0 1 1-1zm-5 11a1 1 0 0 0 0 2h10a1 1 0 0 0 0-2H3z"/></svg>
    Cargar archivo CSV / TXT
  </button>
  <button class="wc-net-btn" id="wc-net-btn" onclick="intentarDescargaRed()">
    Intentar descargar de Google Sheets
  </button>
  <div class="wc-steps">
    <b>Cómo exportar el CSV:</b><br>
    En Google Sheets → Archivo → Descargar → CSV
  </div>
</div>

<!-- HEADER -->
<div id="header">
  <svg id="header-logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="32" height="32" rx="6" fill="#0f1923"/>
    <path d="M16 4L6 10v12l10 6 10-6V10L16 4z" fill="none" stroke="#E87D2B" stroke-width="1.5"/>
    <path d="M16 8l-7 4v8l7 4 7-4v-8l-7-4z" fill="#E87D2B" opacity=".3"/>
    <circle cx="16" cy="16" r="3" fill="#E87D2B"/>
    <path d="M16 13v-5M16 24v-5M11 15l-4.5-2.5M21 17l4.5 2.5M11 17l-4.5 2.5M21 15l4.5-2.5" stroke="#E87D2B" stroke-width="1.2"/>
  </svg>
  <div id="header-title">AUTOTROL · <span>Alumbrado</span></div>
  <div id="count-badge">0 equipos</div>
  <button id="installBtn" onclick="pwaDeferredPrompt&&pwaDeferredPrompt.prompt()">⬇ Instalar</button>
</div>

<!-- SEARCH BAR -->
<div id="searchbar">
  <input id="addr-input" type="text" placeholder="Calle y altura (ej: SALVAT 2800)"
         autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false">
  <div id="radius-wrap">
    <label for="radius-input">Radio</label>
    <input id="radius-input" type="number" value="1000" min="50" max="10000" step="50">
    <span>m</span>
  </div>
  <button id="search-btn" onclick="buscar()">Buscar</button>
  <button id="uploadBtn" onclick="document.getElementById('file-input').click()" title="Cargar archivo CSV/TXT">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a1 1 0 0 1 1 1v5.586l1.293-1.293a1 1 0 1 1 1.414 1.414l-3 3a1 1 0 0 1-1.414 0l-3-3a1 1 0 1 1 1.414-1.414L7 7.586V2a1 1 0 0 1 1-1zm-5 11a1 1 0 0 0 0 2h10a1 1 0 0 0 0-2H3z"/></svg>
    Cargar archivo
  </button>
  <input type="file" id="file-input" accept=".csv,.txt" style="display:none" onchange="cargarDesdeArchivo(this)">
</div>

<!-- MAP -->
<div id="map"></div>

<!-- TOAST -->
<div id="toast"></div>

<!-- LAYER PANEL -->
<div id="layerPanel">
  <h4>Capas</h4>
  <label class="layer-row" id="lr-lampara">
    <input type="checkbox" checked data-tipo="lampara" style="color:var(--c-lampara)" onchange="toggleCapa(this)">
    <span class="layer-dot" style="background:var(--c-lampara)"></span>
    <span class="layer-label">Lámpara</span>
    <span class="layer-count" id="cnt-lampara">0</span>
  </label>
  <label class="layer-row" id="lr-columna">
    <input type="checkbox" checked data-tipo="columna" style="color:var(--c-columna)" onchange="toggleCapa(this)">
    <span class="layer-dot" style="background:var(--c-columna)"></span>
    <span class="layer-label">Columna</span>
    <span class="layer-count" id="cnt-columna">0</span>
  </label>
  <label class="layer-row" id="lr-tablero">
    <input type="checkbox" checked data-tipo="tablero" style="color:var(--c-tablero)" onchange="toggleCapa(this)">
    <span class="layer-dot" style="background:var(--c-tablero)"></span>
    <span class="layer-label">Tablero</span>
    <span class="layer-count" id="cnt-tablero">0</span>
  </label>
  <label class="layer-row" id="lr-transversal">
    <input type="checkbox" checked data-tipo="transversal" style="color:var(--c-transversal)" onchange="toggleCapa(this)">
    <span class="layer-dot" style="background:var(--c-transversal)"></span>
    <span class="layer-label">Transversal</span>
    <span class="layer-count" id="cnt-transversal">0</span>
  </label>
  <label class="layer-row" id="lr-other">
    <input type="checkbox" checked data-tipo="other" style="color:var(--c-other)" onchange="toggleCapa(this)">
    <span class="layer-dot" style="background:var(--c-other)"></span>
    <span class="layer-label">Otro</span>
    <span class="layer-count" id="cnt-other">0</span>
  </label>
</div>

<!-- iOS INSTALL BANNER -->
<div id="iosBanner">
  <span class="ios-close" onclick="this.parentElement.style.display='none'">✕</span>
  Para instalar: toca <b>Compartir</b> → <b>"Agregar a pantalla de inicio"</b>
</div>

  other:      '#607D8B'
};

// ── GAUSS-KRÜGER ARG FAJA 5 → WGS84 ───────────────────────────────────────
function gkToLatLon(X, Y) {
  const a=6378137.0, f=1/298.257222101;
  const e2=2*f-f*f, e4=e2*e2, e6=e2*e2*e2;
  const lon0=-60*Math.PI/180, FE=5500000, FN=10001966;
  const x=X-FE, y=Y-FN;
  const mu=y/(a*(1-e2/4-3*e4/64-5*e6/256));
  const sqe=Math.sqrt(1-e2), n=(1-sqe)/(1+sqe);
  const n2=n*n, n3=n2*n, n4=n2*n2;
  const phi1=mu+(3*n/2-27*n3/32)*Math.sin(2*mu)+(21*n2/16-55*n4/32)*Math.sin(4*mu)+(151*n3/96)*Math.sin(6*mu)+(1097*n4/512)*Math.sin(8*mu);
  const sp=Math.sin(phi1),cp=Math.cos(phi1),tp=sp/cp;
  const N1=a/Math.sqrt(1-e2*sp*sp),T1=tp*tp,C1=e2/(1-e2)*cp*cp;
  const R1=a*(1-e2)/Math.pow(1-e2*sp*sp,1.5);
  const D=x/N1,D2=D*D,D3=D2*D,D4=D2*D2,D5=D3*D2,D6=D3*D3;
  const lat=phi1-(N1*tp/R1)*(D2/2-(5+3*T1+10*C1-4*C1*C1-9*e2/(1-e2))*D4/24+(61+90*T1+298*C1+45*T1*T1-252*e2/(1-e2)-3*C1*C1)*D6/720);
  const lon=lon0+(D-(1+2*T1+C1)*D3/6+(5-2*C1+28*T1-3*C1*C1+8*e2/(1-e2)+24*T1*T1)*D5/120)/cp;
  return {lat:lat*180/Math.PI, lon:lon*180/Math.PI};
}

let datos = [];
let map, layers = {}, radiusCircle;
let pwaDeferredPrompt = null;

// ── MAP INIT ───────────────────────────────────────────────────────────────
function initMap(){
  map = L.map('map',{center:[-32.883,-60.723],zoom:14,zoomControl:true,preferCanvas:true});

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{

  }).addTo(map);

  // Filtro oscuro
  setTimeout(()=>{

  },100);

  // Una capa por tipo
  Object.keys(TIPO_COLOR).forEach(tipo=>{
    layers[tipo] = L.layerGroup().addTo(map);
  });
}

// ── CAPAS / TOGGLE ─────────────────────────────────────────────────────────
function toggleCapa(cb){
  const tipo = cb.dataset.tipo;
  if(cb.checked) layers[tipo].addTo(map);
  else map.removeLayer(layers[tipo]);
}

// ── CSV PARSER ─────────────────────────────────────────────────────────────
function parseRow(row,sep){
  const cols=[];let inQ=false,cur='';
  for(let i=0;i<row.length;i++){
    const c=row[i];
    if(c==='"') inQ=!inQ;
    else if(c===sep&&!inQ){cols.push(cur);cur='';}
    else cur+=c;
  }
  cols.push(cur); return cols;
}
function detectSep(l){return((l.match(/;/g)||[]).length>(l.match(/,/g)||[]).length)?';':',';}
function parseCoord(s){if(!s)return NaN;return parseFloat(s.trim().replace(',','.'));}

function parseCSV(text){
  const lines=text.split(/\r?\n/);
  if(lines.length<2) return [];
  const sep=detectSep(lines[0]);
  const hdrs=parseRow(lines[0],sep).map(h=>h.replace(/"/g,'').trim().toLowerCase());

  const fi=(fn)=>hdrs.findIndex(h=>h.includes(fn));
  const idx={
    serie:  fi('serie') >=0?fi('serie') :COL.serie,
    tipo:   hdrs.findIndex(h=>h==='tipo')>=0?hdrs.findIndex(h=>h==='tipo'):COL.tipo,
    clasif: fi('clasif')>=0?fi('clasif'):COL.clasif,
    calle:  fi('calle') >=0?fi('calle') :COL.calle,
    altura: fi('altura')>=0?fi('altura'):COL.altura,
    gkX:    fi('coordenada x')>=0?fi('coordenada x'):COL.gkX,
    gkY:    fi('coordenada y')>=0?fi('coordenada y'):COL.gkY,
  };

  const result=[];
  for(let i=1;i<lines.length;i++){
    const line=lines[i].trim(); if(!line) continue;
    const cols=parseRow(line,sep);
    const gkX=parseCoord(cols[idx.gkX]), gkY=parseCoord(cols[idx.gkY]);
    if(isNaN(gkX)||isNaN(gkY)) continue;
    if(gkX<4000000||gkX>7000000||gkY<4000000||gkY>8000000) continue;
    const {lat,lon}=gkToLatLon(gkX,gkY);
    if(isNaN(lat)||isNaN(lon)) continue;
    if(lat<-55||lat>-20||lon<-75||lon>-50) continue;
    result.push({
      serie: (cols[idx.serie] ||'').replace(/"/g,''),
      tipo:  (cols[idx.tipo]  ||'').replace(/"/g,''),
      clasif:(cols[idx.clasif]||'').replace(/"/g,''),
      calle: (cols[idx.calle] ||'').replace(/"/g,'').trim().toUpperCase(),
      altura:(cols[idx.altura]||'').replace(/"/g,'').trim(),
      lat,lon
    });
  }
  return result;
}

// ── PERSISTENCIA JSON EN CACHE API ─────────────────────────────────────────
async function guardarEnCache(arr){
  // localStorage (rápido)
  try{
    localStorage.setItem(CACHE_KEY, JSON.stringify(arr));
    localStorage.setItem(CACHE_TS, Date.now().toString());
  }catch(e){}
  // Cache API (persistente, accesible offline por SW)
  try{
    const cache = await caches.open(SW_CACHE);
    const blob  = new Blob([JSON.stringify(arr)],{type:'application/json'});
    const resp  = new Response(blob,{status:200,headers:{'Content-Type':'application/json','X-Cached-At':Date.now().toString()}});
    await cache.put(DATA_URL, resp);
  }catch(e){}
}

async function leerDeCache(){
  // 1. localStorage
  try{
    const ts=localStorage.getItem(CACHE_TS), raw=localStorage.getItem(CACHE_KEY);
    if(ts && raw && (Date.now()-parseInt(ts))<CACHE_TTL){
      const parsed=JSON.parse(raw);
      if(parsed.length>0) return parsed;
    }
  }catch(e){}
  // 2. Cache API (puede tener datos aunque localStorage esté vacío)
  try{
    const cache=await caches.open(SW_CACHE);
    const resp=await cache.match(DATA_URL);
    if(resp){
      const parsed=await resp.json();
      if(parsed.length>0) return parsed;
    }
  }catch(e){}
  return null;
}

// ── DATA LOADING ───────────────────────────────────────────────────────────
async function cargarDatos(){
  const cached = await leerDeCache();
  if(cached){
    datos = cached;
    ocultarWelcome();
    actualizarBadge();
    toast(`${datos.length.toLocaleString()} equipos cargados`);
    return;
  }
  mostrarWelcome();
  intentarDescargaRed(true);
}

async function intentarDescargaRed(silent){
  const btn=document.getElementById('wc-net-btn');
  if(!silent){btn.disabled=true;btn.innerHTML='<span class="wc-spinner"></span>Descargando…';}
  for(let i=0;i<CSV_URLS.length;i++){
    try{
      const ctrl=new AbortController();
      const tid=setTimeout(()=>ctrl.abort(),8000);
      const resp=await fetch(CSV_URLS[i],{signal:ctrl.signal});
      clearTimeout(tid);
      if(!resp.ok) throw new Error('HTTP '+resp.status);
      const text=await resp.text();
      if(text.trim().startsWith('<!')) throw new Error('HTML response');
      const parsed=parseCSV(text);
      if(parsed.length===0) throw new Error('Sin datos');
      datos=parsed;
      await guardarEnCache(datos);
      ocultarWelcome(); actualizarBadge();
      toast(`✓ ${datos.length.toLocaleString()} equipos descargados`);
      return;
    }catch(e){}
  }
  if(!silent){
    btn.disabled=false; btn.textContent='Intentar descargar de Google Sheets';
    toast('No se pudo conectar. Verificá que la planilla sea pública.',5000);
  }
}

function cargarDesdeArchivo(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async function(e){
    try{
      const parsed=parseCSV(e.target.result);
      if(parsed.length===0){toast('No se encontraron coordenadas válidas (columnas M y N).'); return;}
      datos=parsed;
      await guardarEnCache(datos);
      ocultarWelcome(); actualizarBadge();
      document.getElementById('uploadBtn').classList.add('active');
      toast(`✓ ${datos.length.toLocaleString()} equipos cargados desde archivo`);
    }catch(err){ toast('Error al leer el archivo: '+err.message); }
  };
  reader.onerror=()=>toast('Error al leer el archivo.');
  reader.readAsText(file,'UTF-8');
  input.value='';
}

function mostrarWelcome(){ document.getElementById('welcomeCard').classList.remove('hidden'); }
function ocultarWelcome(){ document.getElementById('welcomeCard').classList.add('hidden'); }
function actualizarBadge(){
  if(datos.length>0) document.getElementById('count-badge').textContent=`${datos.length.toLocaleString()} equipos`;
}

// ── GEOCODIFICACIÓN ────────────────────────────────────────────────────────
async function geocodificar(addr){
  const q=encodeURIComponent(`${addr}, ${CITY_HINT}`);
  const resp=await fetch(`${NOMINATIM}?q=${q}&format=json&limit=1`,{headers:{'Accept-Language':'es'}});
  const arr=await resp.json();
  if(!arr.length) throw new Error('No se encontró la dirección');
  return {lat:parseFloat(arr[0].lat),lon:parseFloat(arr[0].lon)};
}

function haversine(lat1,lon1,lat2,lon2){
  const R=6371000, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ── TIPO HELPERS ──────────────────────────────────────────────────────────
function tipoKey(tipo){
  const t=tipo.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  if(t.includes('lampara')||t.includes('lamp')) return 'lampara';
  if(t.includes('columna'))   return 'columna';
  if(t.includes('tablero'))   return 'tablero';
  if(t.includes('transversal')) return 'transversal';
  return 'other';
}

function makeIcon(tipo){
  const color=TIPO_COLOR[tipoKey(tipo)];
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="${color}" stroke="#fff" stroke-width="1.5"/></svg>`;
  return L.divIcon({html:svg,iconSize:[14,14],iconAnchor:[7,7],className:'',popupAnchor:[0,-7]});
}

function makePopup(d){
  const tk=tipoKey(d.tipo);
  return `<div class="popup-body">
    <div class="popup-serie">Nº ${d.serie}</div>
    <span class="popup-tipo ${tk}">${d.tipo||'Sin tipo'}</span>
    ${d.clasif?`<div class="popup-row"><b>Clasificación:</b> ${d.clasif}</div>`:''}
    <div class="popup-row"><b>Ubicación:</b> ${d.calle} ${d.altura}</div>
    <div class="popup-row"><b>Coord:</b> ${d.lat.toFixed(6)}, ${d.lon.toFixed(6)}</div>
  </div>`;
}

// ── BÚSQUEDA ──────────────────────────────────────────────────────────────
async function buscar(){
  const addr=document.getElementById('addr-input').value.trim();
  const radio=parseInt(document.getElementById('radius-input').value)||1000;
  if(!addr){toast('Ingresá una dirección para buscar');return;}
  if(!datos.length){mostrarWelcome();return;}

  const btn=document.getElementById('search-btn');
  btn.textContent='Buscando…';btn.disabled=true;btn.classList.add('loading');

  try{
    const geo=await geocodificar(addr);
    const dentro=datos.filter(d=>haversine(geo.lat,geo.lon,d.lat,d.lon)<=radio);

    // Limpiar capas
    Object.values(layers).forEach(l=>l.clearLayers());
    if(radiusCircle){map.removeLayer(radiusCircle);radiusCircle=null;}

    // Círculo de radio
    radiusCircle=L.circle([geo.lat,geo.lon],{
      radius:radio,color:'#E87D2B',weight:1.5,fillColor:'#E87D2B',fillOpacity:0.06
    }).addTo(map);

    // Resetear contadores
    contadores={lampara:0,columna:0,tablero:0,transversal:0,other:0};

    // Agregar marcadores a la capa correspondiente
    dentro.forEach(d=>{
      const tk=tipoKey(d.tipo);
      contadores[tk]++;
      const m=L.marker([d.lat,d.lon],{icon:makeIcon(d.tipo)});
      m.bindPopup(makePopup(d),{className:'autotrol-popup',maxWidth:240});
      layers[tk].addLayer(m);
    });

    // Actualizar contadores en panel
    Object.keys(contadores).forEach(k=>{
      const el=document.getElementById('cnt-'+k);
      if(el) el.textContent=contadores[k]||'';
    });

    map.setView([geo.lat,geo.lon],radio<=300?17:radio<=600?16:radio<=1500?15:14);
    document.getElementById('count-badge').textContent=`${dentro.length.toLocaleString()} equipo${dentro.length!==1?'s':''}`;
    toast(`${dentro.length} equipos en ${radio} m de "${addr.split(',')[0]}"`);
  }catch(err){
    toast(err.message||'Error al buscar dirección');
  }finally{
    btn.textContent='Buscar';btn.disabled=false;btn.classList.remove('loading');
  }
}

document.getElementById('addr-input').addEventListener('keydown',e=>{if(e.key==='Enter')buscar();});

}
